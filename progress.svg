<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="40"
     viewBox="0 0 500 40">

  <!-- Change ONLY this value -->
  <metadata progress="60"/>

  <rect width="500" height="40" rx="20" fill="#21262d"/>

  <!-- 60% of 500 = 300 -->
  <rect width="300" height="40" rx="20" fill="#238636"/>

  <text x="250" y="26"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="white">60%</text>
</svg>